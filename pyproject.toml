[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ravi-core"
version = "0.1.0"
description = "Target-aware remote diagnostics, memory monitors and DOS execution"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Danila Sukharev"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ravi.backends.robotron1715w" = ["rom.asm", "rom.bin", "rom.json", "rom-w3.bin", "rom-w3.json", "helper.asm", "diagnostics/*.asm", "baseline/rom.asm", "baseline/rom.bin", "baseline/rom.json"]
"ravi.backends.robotron1715" = ["smoke.asm", "smoke.bin", "monitor.asm", "monitor.bin"]

[project.optional-dependencies]
test = ["ruff>=0.8"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
