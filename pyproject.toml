[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ravi-core"
version = "0.1.0"
description = "Target-aware remote diagnostics, memory monitors and DOS execution"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Danila Sukharev"}]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["ruff>=0.8"]
